[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,145

[Metadata]
Name=CPU RAM GPU Mini
Author=OpenAI
Information=Compact CPU / RAM / GPU monitor with semi-transparent black background
Version=1.3

[Variables]
FontName=Segoe UI
FontSize=8
TextColor=245,245,245,255
BarColor=0,145,255,255
BarBack=70,70,70,210
BarX=58
BarW=80
BarH=10

[MeasureCPU]
Measure=CPU
Processor=0

[MeasureRAM]
Measure=PhysicalMemory

[MeasureGPU]
Measure=Plugin
Plugin=UsageMonitor
Alias=GPU
Index=0
MinValue=0
MaxValue=100

[MeasureGPUNumber]
Measure=Calc
Formula=MeasureGPU
MinValue=0
MaxValue=100

[MeterCPUText]
Meter=String
Text=CPU
X=3
Y=2
FontFace=#FontName#
FontSize=#FontSize#
FontColor=#TextColor#
AntiAlias=1

[MeterCPUValue]
Meter=String
MeasureName=MeasureCPU
Text=%1%
X=31
Y=2
FontFace=#FontName#
FontSize=#FontSize#
FontColor=#TextColor#
NumOfDecimals=0
AntiAlias=1

[MeterRAMText]
Meter=String
Text=RAM
X=3
Y=18
FontFace=#FontName#
FontSize=#FontSize#
FontColor=#TextColor#
AntiAlias=1

[MeterRAMValue]
Meter=String
MeasureName=MeasureRAM
Text=%1%
X=31
Y=18
FontFace=#FontName#
FontSize=#FontSize#
FontColor=#TextColor#
Percentual=1
NumOfDecimals=0
AntiAlias=1

[MeterGPUText]
Meter=String
Text=GPU
X=3
Y=34
FontFace=#FontName#
FontSize=#FontSize#
FontColor=#TextColor#
AntiAlias=1

[MeterGPUValue]
Meter=String
MeasureName=MeasureGPUNumber
Text=%1%
X=31
Y=34
FontFace=#FontName#
FontSize=#FontSize#
FontColor=#TextColor#
NumOfDecimals=0
AntiAlias=1

[MeterCPUBack]
Meter=Shape
X=#BarX#
Y=3
Shape=Rectangle 0,0,#BarW#,#BarH# | Fill Color #BarBack# | StrokeWidth 0

[MeterRAMBack]
Meter=Shape
X=#BarX#
Y=19
Shape=Rectangle 0,0,#BarW#,#BarH# | Fill Color #BarBack# | StrokeWidth 0

[MeterGPUBack]
Meter=Shape
X=#BarX#
Y=35
Shape=Rectangle 0,0,#BarW#,#BarH# | Fill Color #BarBack# | StrokeWidth 0

[MeterCPUBar]
Meter=Bar
MeasureName=MeasureCPU
X=#BarX#
Y=3
W=#BarW#
H=#BarH#
BarOrientation=Horizontal
BarColor=#BarColor#
SolidColor=0,0,0,1

